version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: coop-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-cooperative_society}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - coop-network
    restart: unless-stopped

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: coop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coop-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: coop-api-gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cooperative_society}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    networks:
      - coop-network
    restart: unless-stopped

  # Member Service
  member-service:
    build:
      context: .
      dockerfile: ./apps/member-service/Dockerfile
    container_name: coop-member-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cooperative_society}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres
    networks:
      - coop-network
    restart: unless-stopped

  # Loan Service
  loan-service:
    build:
      context: .
      dockerfile: ./apps/loan-service/Dockerfile
    container_name: coop-loan-service
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cooperative_society}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres
    networks:
      - coop-network
    restart: unless-stopped

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: coop-web
    ports:
      - "80:80"
    environment:
      NODE_ENV: production
      VITE_API_URL: http://api-gateway:3000
    depends_on:
      - api-gateway
    networks:
      - coop-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: coop-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
      - member-service
      - loan-service
      - web
    networks:
      - coop-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  coop-network:
    driver: bridge